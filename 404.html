<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>St. Andrew's TDS - Access Restricted</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      color: #eee;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }
    .bg-lines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-image: repeating-linear-gradient(
        115deg,
        transparent 0px,
        transparent 70px,
        rgba(220, 40, 55, 0.35) 70px,
        rgba(220, 40, 55, 0.35) 72px
      );
      background-size: 300px 300px;
      animation: driftLines 12s linear infinite;
    }
    @keyframes driftLines {
      0%   { background-position: 0 0; }
      100% { background-position: 300px 300px; }
    }
    .bg-logo {
      position: fixed;
      top: 35%;
      left: 12%;
      transform: translate(-50%, -50%) rotate(-6deg);
      width: 62vw;
      min-width: 500px;
      height: auto;
      opacity: 0.16;
      mix-blend-mode: screen;
      z-index: 0;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 1.5rem;
      max-width: 500px;
      line-height: 1.5;
      margin: 0;
    }
    footer {
      position: fixed;
      bottom: 16px;
      font-size: 0.8rem;
      color: #777;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg-lines"></div>
  <img class="bg-logo" src="logo.png" alt="">
  <div class="content">
    <h1 id="message"></h1>
  </div>
  <footer>Designed By Echovant</footer>

  <script>
    /* ============================================================
       TO SWITCH THE MESSAGE:
       Change the word inside the quotes below to either:
         "maintenance"  -> "St. Andrew's TDS is currently undergoing
                             repair/updates. Check back soon."
         "restricted"   -> "Access to St. Andrew's TDS through the
                             cloud is currently restricted. Check
                             back soon."
       Save and commit the file. That's the only line you need to touch.
       ============================================================ */
    const MODE = "maintenance";

    const messages = {
      maintenance: "St. Andrew's TDS is currently undergoing repair/updates.<br>Check back soon.",
      restricted: "Access to St. Andrew's TDS through the cloud is currently restricted.<br>Check back soon."
    };

    document.getElementById("message").innerHTML = messages[MODE];
  </script>
</body>
</html>
